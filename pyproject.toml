[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-enterprise-retrieval"
version = "0.1.0"
description = "Cost-aware adaptive retrieval for enterprise support — Team 13"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3"]
demo = [
    "sentence-transformers>=5,<7",
    "mlx-lm>=0.26.2,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools.packages.find]
where = ["src"]
